name: Feature request
description: Propose an improvement or new capability
labels: [enhancement, triage]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What can't you do (or do well) today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: If it affects optic.yaml, sketch the schema you'd want.
      render: yaml
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
