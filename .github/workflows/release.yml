name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # create the release
  packages: write # push to ghcr
  id-token: write # cosign keyless signing

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # goreleaser builds the changelog from history

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      # Gate the release on the same checks CI runs, plus the governance
      # assertions: a release that stops redacting would be worse than no
      # release at all.
      - name: Test
        run: go test ./...
      - name: Governance rule assertions
        run: go run ./cmd/optictrace test -config optic.yaml -tests optic.test.yaml

      - uses: sigstore/cosign-installer@v3
      - uses: anchore/sbom-action/download-syft@v0
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Optional: set this repo secret to publish the Homebrew formula.
          # Without it, goreleaser skips the brew step rather than failing.
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN || secrets.GITHUB_TOKEN }}
