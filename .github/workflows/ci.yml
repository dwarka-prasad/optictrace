name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  go:
    runs-on: ubuntu-latest
    services:
      # The Postgres driver is only meaningfully tested against a real server;
      # the conformance suite skips it when this DSN is absent.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: optic
          POSTGRES_DB: optictrace
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25'
      - name: Vet & format
        run: |
          go vet ./...
          test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: Test (both store drivers)
        env:
          OPTICTRACE_TEST_POSTGRES: postgres://postgres:optic@localhost:5432/optictrace?sslmode=disable
        run: go test -race ./...
      - name: Validate example config
        run: go run ./cmd/optictrace validate -config optic.yaml
      - name: Governance rule assertions
        # Fails the build if a change stops a rule from redacting/restricting.
        run: go run ./cmd/optictrace test -config optic.yaml -tests optic.test.yaml
      - name: Build the lead-pipeline demo
        # The demo services live in the root module, so a change that breaks
        # them fails here rather than the next time someone runs the demo.
        run: go build ./examples/lead-pipeline/... && go vet ./examples/lead-pipeline/...

      - name: Validate the demo configs
        run: |
          for c in examples/lead-pipeline/optic/*.yaml; do
            go run ./cmd/optictrace validate -config "$c"
          done

      - name: Test the admin-extension example
        working-directory: examples/adminauth
        # SSO + RBAC + audit against the real admin server, from a module that
        # cannot reach internal/. Guards the access-control surface.
        run: go build ./... && go vet ./... && go test -race ./...

      - name: Test the store-extension example
        working-directory: examples/memstore
        # Its own module, outside the optictrace/ path prefix, so it can only
        # use ext/. If this stops compiling, the extension surface has a hole
        # — which is exactly what it is here to detect.
        run: go build ./... && go vet ./... && go test -race ./...

      - name: Test Gin SDK
        working-directory: sdks/gin
        # Tested, not just built: this module holds the Hijack/Flush/Pusher
        # adapter surface, which is exactly where a wrapper breaks silently.
        run: go build ./... && go vet ./... && go test -race ./...

  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Build dashboard
        working-directory: ui
        run: npm ci --no-audit --no-fund && npm run build

  sdks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Express SDK tests
        working-directory: sdks/express
        run: npm install --no-audit --no-fund && npm test
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: FastAPI SDK tests
        working-directory: sdks/fastapi
        run: pip install pyyaml && python test_middleware.py

  assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Validate Prometheus alert rules
        run: |
          docker run --rm -v "$PWD/deploy/prometheus/alerts.yml:/a.yml:ro" \
            --entrypoint promtool prom/prometheus:v2.53.0 check rules /a.yml
      - name: Validate goreleaser config
        run: docker run --rm -v "$PWD:/src" -w /src goreleaser/goreleaser:latest check
      - name: Validate Grafana dashboard JSON
        run: python3 -c "import json;json.load(open('deploy/grafana/dashboard.json'))"

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build image
        run: docker build -t optictrace:ci .
