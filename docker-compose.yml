# Local evaluation stack: OpticTrace + a demo upstream + Prometheus.
#
#   docker compose up --build
#
#   http://localhost:8080  -> proxied demo API
#   http://localhost:9095  -> OpticTrace dashboard, /metrics, /api/*
#   http://localhost:9090  -> Prometheus (pre-configured scrape + alert rules)
#   http://localhost:3000  -> Grafana with the OpticTrace dashboard provisioned

services:
  optictrace:
    build: .
    ports:
      # Bound to loopback deliberately. Docker's default "9095:9095" publishes
      # on 0.0.0.0, which would put the dashboard — and every captured payload
      # behind it — on your LAN. Change to "0.0.0.0:9095:9095" only alongside
      # telemetry.auth in deploy/compose/optic.yaml.
      - "127.0.0.1:8080:8080"   # proxied traffic
      - "127.0.0.1:9095:9095"   # admin: dashboard + /metrics + APIs
    volumes:
      - ./deploy/compose/optic.yaml:/etc/optictrace/optic.yaml:ro
      - optic-data:/data
    depends_on:
      - demo-upstream
    restart: unless-stopped

  demo-upstream:
    build:
      context: .
      dockerfile: deploy/compose/Dockerfile.mocktarget
    expose:
      - "9000"
    restart: unless-stopped

  # Runs once and exits: without it the stack comes up correct but empty, and
  # an empty dashboard tells you nothing about whether the rules work.
  seeder:
    build:
      context: .
      dockerfile: deploy/compose/Dockerfile.seeder
    environment:
      PROXY: optictrace:8080
      ADMIN: optictrace:9095
      ROUNDS: "6"
    depends_on:
      - optictrace
    restart: "no"

  prometheus:
    image: prom/prometheus:v2.53.0
    ports:
      - "9090:9090"
    volumes:
      - ./deploy/compose/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prom-data:/prometheus
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.1.0
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: optictrace
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboard.json:/var/lib/grafana/dashboards/optictrace.json:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  optic-data:
  prom-data:
  grafana-data:
