# Compose-stack config: proxy the bundled demo upstream.
version: 1

service:
  name: demo-api
  listen: ":8080"
  upstream: "http://demo-upstream:9000"

telemetry:
  admin_listen: ":9095"
  console_log: true
  store:
    driver: sqlite
    dsn: /data/optictrace.db
    retention_max_rows: 100000

defaults:
  capture:
    request_body: true
    response_body: true
    headers: true

rules:
  - name: no-capture-on-auth
    match:
      path: "/api/v1/auth/**"
    restrict: [request_body, response_body, headers]

  - name: redact-payment-secrets
    match:
      path: "/api/v1/payments/**"
    redact:
      headers: [Authorization, X-Api-Key, Cookie]
      json_fields:
        - "$.**.credit_card.number"
        - "$.**.credit_card.cvv"
        - "$.**.customer.email"
    labels:
      tenant: "header:X-Tenant-ID"
      region: "header:X-Region"
