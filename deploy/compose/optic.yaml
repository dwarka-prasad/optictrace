# Compose-stack config: proxies the bundled demo upstream.
#
# This is the guided tour — it exercises every governance mechanism against
# the demo API so `docker compose up` produces a dashboard with something
# real on it, not an empty shell.
version: 1

service:
  name: demo-api
  listen: ":8080"
  upstream: "http://demo-upstream:9000"
  trace:
    # Correlation is on by default; this also hands the trace id back to the
    # caller so a support ticket can arrive with one in it.
    response_header: "X-Trace-Id"

telemetry:
  # Inside the container this must bind all interfaces to be reachable at all;
  # the exposure boundary is the host port publish in docker-compose.yml, which
  # is pinned to 127.0.0.1. If you republish this on 0.0.0.0, uncomment `auth`
  # below — the admin API can read every captured payload.
  admin_listen: "0.0.0.0:9095"
  # auth:
  #   token_env: OPTICTRACE_ADMIN_TOKEN
  console_log: true
  metrics:
    enabled: true
    max_label_values: 500      # cardinality guard on tenant/region
  # ---------------------------------------------------------------------------
  # APPLICATION LOGS — the lines your app wrote while serving a request.
  #
  # Correlation is a fact, not a guess. OpticTrace rewrites the traceparent on
  # the request it FORWARDS, so the span-id in the header your app receives is
  # the span OpticTrace recorded. An app that ships its logs with that span id
  # gets them filed under the exact request that produced them; nothing is
  # matched by timestamp, which under concurrency would file one tenant's line
  # under another tenant's request.
  #
  # Post lines to POST /api/applogs/ingest, read them back with
  # GET /api/applogs?trace=... or ?span=...
  #
  # Treat this as the highest-risk surface here. A payload is structured and
  # can be redacted by path; a log line is free text written by whoever was
  # debugging that day, and it routinely carries tokens and whole payloads
  # inside stack traces. Everything below runs BEFORE anything is stored.
  # ---------------------------------------------------------------------------
  app_logs:
    enabled: true
    level_min: info            # debug is most of the volume and little of the value
    max_lines_per_span: 200    # one retry loop must not write a million lines
    max_message_bytes: 8192    # stack traces are long; the head is what matters
    retention_max_age: 168h    # 7 days — logs outgrow records by orders of magnitude
    # Lines with no span belong to no request (startup, cron, background jobs).
    # Dropped by default; every drop is counted in
    # optictrace_app_logs_dropped_total{reason="orphan"} rather than vanishing.
    drop_orphans: true
    redact:
      # Single-quoted: YAML double quotes reject escapes like \s.
      patterns:
        - 'Bearer\s+\S+'          # the header someone logged while debugging
        - '\b\d{13,19}\b'         # card-shaped digit runs
        - '[\w.+-]+@[\w-]+\.[\w.]+' # email addresses
      fields: [authorization, password, token, api_key]

  store:
    driver: sqlite
    dsn: /data/optictrace.db
    retention_max_rows: 100000
    retention_max_age: 720h    # 30 days
  exporters:
    # Governed records also land on disk as JSONL, so you can see exactly
    # what a downstream consumer would receive.
    - name: audit-log
      type: file
      path: /data/audit.jsonl
      flush_interval: 2s
  billing:
    consumer_label: tenant
    currency: USD
    prices:
      per_request: 0.0001
      per_gb: 0.05
      per_meter_unit:
        tokens: 0.000002       # $2 per 1M tokens

defaults:
  # Capture is opt-out: everything is recorded unless a rule restricts it.
  capture:
    request_body: true
    response_body: true
    headers: true
    query: true

rules:
  # Credentials must never reach telemetry: capture nothing but metadata.
  - name: no-capture-on-auth
    match:
      path: "/api/v1/auth/**"
    restrict: [request_body, response_body, headers]
    # Capture and attribution are independent: a label is read from the LIVE
    # request, so this route can be billed to a tenant while none of its
    # payload is recorded. Without this, every login is revenue you cannot
    # attribute to a customer.
    labels:
      tenant: "header:X-Tenant-ID"

  # Mask payment secrets. `$.**` follows the field even when the upstream
  # echoes the payload back inside a wrapper.

  - name: redact-payment-secrets
    match:
      path: "/api/v1/payments/**"
    redact:
      headers: [Authorization, X-Api-Key, Cookie]
      query_params: [api_key, session]
      json_fields:
        - "$.**.credit_card.number"
        - "$.**.credit_card.cvv"
        - "$.**.customer.email"
    labels:
      tenant: "header:X-Tenant-ID"
      # Roll the AZ up to a geography: ap-south-1 and ap-south-2 are one
      # series, which keeps the cardinality guard from ever being the thing
      # that decides your dashboard.
      region: "header:X-Region|^([a-z]{2})-"
      # The caller is in the payload, not a header — two partners hit this
      # endpoint as the same tenant, and this is the only field separating
      # them. Reading it is safe: labels see the body AFTER redaction.
      partner: "json:$.**.source"
      outcome: "json_response:$.status"

  # Prompts and completions stay private, but tokens are still counted and
  # priced per tenant — metering is independent of capture.
  - name: meter-ai-tokens
    match:
      path: "/api/v1/ai/**"
    restrict: [request_body, response_body]
    meter:
      tokens: "$.usage.total_tokens"
    labels:
      tenant: "header:X-Tenant-ID"

  # Criteria narrow a rule past the route. Same path, same tenant, different
  # channel — so the tag has to come from the request itself.
  - name: tag-marketplace-callers
    match:
      path: "/api/v1/payments/**"
      body:
        "$.**.source": "^(flipkart|amazon)$"
    labels:
      channel: "static:marketplace"

  # Hot routes: sample bodies, but never throw away an error or a slow one.
  - name: sample-user-reads
    match:
      path: "/api/v1/users/**"
    redact:
      # Arrives in the response, not the request — the leak nobody sent.
      json_fields: ["$.**.email"]
    sample: 0.5
    keep_errors: true
    keep_slower_than: 250ms
    labels:
      tenant: "header:X-Tenant-ID"

  # NOTE: /api/v1/orders is deliberately left ungoverned so that
  # `optictrace scan` and `optictrace suggest` have something to find.
