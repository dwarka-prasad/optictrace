replicaCount: 1

image:
  repository: ghcr.io/dwarka-prasad/optictrace
  tag: latest
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  proxyPort: 8080
  adminPort: 9095

# Prometheus Operator integration (requires the ServiceMonitor CRD).
serviceMonitor:
  enabled: false
  interval: 15s

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    memory: 256Mi

persistence:
  enabled: false # PVC for the SQLite payload store
  size: 1Gi
  storageClass: ""

# Admin API authentication. ON by default: the admin port serves the dashboard
# and every captured payload, and inside a cluster it is reachable by anything
# that can resolve the Service. Turning this off is a deliberate choice.
auth:
  enabled: true
  # Leave empty to generate a random token on first install. It is preserved
  # across upgrades, so clients holding it keep working.
  #   kubectl get secret <release>-admin-token -o jsonpath='{.data.token}' | base64 -d
  token: ""
  # Bring your own Secret instead (e.g. from an external secrets operator).
  existingSecret: ""
  existingSecretKey: token

# Rendered verbatim into the ConfigMap as optic.yaml.
config:
  version: 1
  service:
    name: my-api
    listen: ":8080"
    upstream: "http://my-api-backend:80"
  telemetry:
    admin_listen: ":9095"
    store:
      driver: sqlite
      dsn: /data/optictrace.db
  defaults:
    capture:
      request_body: true
      response_body: true
      headers: true
  rules:
    - name: no-capture-on-auth
      match:
        path: "/auth/**"
      restrict: [request_body, response_body, headers]
