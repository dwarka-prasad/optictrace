{{- if and .Values.auth.enabled (not .Values.auth.existingSecret) }}
{{- /*
  The admin token. Generated once on first install and preserved across
  upgrades by reading the live Secret back — regenerating it on every `helm
  upgrade` would silently lock out anything already holding the old token.
*/ -}}
{{- $name := printf "%s-admin-token" (include "optictrace.fullname" .) }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- $token := .Values.auth.token }}
{{- if and (not $token) $existing }}
{{- $token = index $existing.data "token" | b64dec }}
{{- end }}
{{- if not $token }}
{{- $token = randAlphaNum 40 }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels: {{- include "optictrace.labels" . | nindent 4 }}
type: Opaque
data:
  token: {{ $token | b64enc | quote }}
{{- end }}
