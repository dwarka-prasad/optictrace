# =============================================================================
# optic.yaml — OpticTrace declarative telemetry & governance specification
# =============================================================================
# Philosophy: OPT-OUT by default. Everything is captured unless a rule says
# otherwise. Rules are evaluated top-to-bottom; every rule whose `match` block
# matches the request contributes to the final policy (later rules win on
# conflicting capture flags; redactions and labels accumulate).
#
# Path globbing:
#   *   matches exactly one path segment   (/api/*/health)
#   **  matches zero or more segments      (/api/v1/payments/**)
#   Standard shell patterns work inside a segment (/api/v1/user-*)
# =============================================================================

version: 1

service:
  name: payments-api
  # Address the OpticTrace proxy listens on (standalone sidecar mode).
  listen: ":8080"
  # The upstream service traffic is forwarded to.
  upstream: "http://localhost:9000"

# Observability sinks: Prometheus /metrics, the developer dashboard, and the
# payload store all hang off a SEPARATE admin listener so you can firewall it
# away from proxied traffic.
telemetry:
  # Loopback by default: the admin API serves the dashboard and every
  # captured payload. Set "0.0.0.0:9095" only alongside `auth` below.
  admin_listen: "127.0.0.1:9095"
  console_log: true          # structured JSON telemetry on stdout
  metrics:
    enabled: true
    # buckets: [0.005, 0.05, 0.5, 5]   # override latency histogram bounds (seconds)
    # Cardinality guard. Label values come from arbitrary request headers, so
    # one buggy client can otherwise create unbounded Prometheus series.
    # Beyond this many distinct values, a label collapses to __over_limit__.
    max_label_values: 500              # 0 disables the guard
  # ---------------------------------------------------------------------------
  # APPLICATION LOGS — the lines your app wrote while serving a request.
  #
  # Correlation is a fact, not a guess. OpticTrace rewrites the traceparent on
  # the request it FORWARDS, so the span-id in the header your app receives is
  # the span OpticTrace recorded. An app that ships its logs with that span id
  # gets them filed under the exact request that produced them; nothing is
  # matched by timestamp, which under concurrency would file one tenant's line
  # under another tenant's request.
  #
  # Post lines to POST /api/applogs/ingest, read them back with
  # GET /api/applogs?trace=... or ?span=...
  #
  # Treat this as the highest-risk surface here. A payload is structured and
  # can be redacted by path; a log line is free text written by whoever was
  # debugging that day, and it routinely carries tokens and whole payloads
  # inside stack traces. Everything below runs BEFORE anything is stored.
  # ---------------------------------------------------------------------------
  app_logs:
    enabled: true
    level_min: info            # debug is most of the volume and little of the value
    max_lines_per_span: 200    # one retry loop must not write a million lines
    max_message_bytes: 8192    # stack traces are long; the head is what matters
    retention_max_age: 168h    # 7 days — logs outgrow records by orders of magnitude
    # Lines with no span belong to no request (startup, cron, background jobs).
    # Dropped by default; every drop is counted in
    # optictrace_app_logs_dropped_total{reason="orphan"} rather than vanishing.
    drop_orphans: true
    redact:
      # Single-quoted: YAML double quotes reject escapes like \s.
      patterns:
        - 'Bearer\s+\S+'          # the header someone logged while debugging
        - '\b\d{13,19}\b'         # card-shaped digit runs
        - '[\w.+-]+@[\w-]+\.[\w.]+' # email addresses
      fields: [authorization, password, token, api_key]

  store:
    driver: sqlite            # sqlite | none
    dsn: optictrace.db
    queue_size: 4096          # async write queue; overflow drops (never blocks)
    retention_max_rows: 100000
  # Output plugins: every governed record (post-restriction, post-redaction)
  # also fans out to these destinations. Three types are built in:
  #   file     append JSONL, rotated at max_size_mb
  #   webhook  POST JSON batches to an HTTP endpoint
  #   command  CUSTOM PLUGIN — stream JSONL to any executable's stdin
  # exporters:
  #   - name: audit-log
  #     type: file
  #     path: ./export/audit.jsonl
  #   - name: siem
  #     type: webhook
  #     url: https://siem.internal/ingest
  #     headers: { Authorization: "Bearer ..." }
  #     batch_size: 100
  #     flush_interval: 5s
  #   - name: my-plugin
  #     type: command
  #     command: ["python3", "examples/exporters/csv_exporter.py", "traffic.csv"]
  # FinOps: attribute usage & cost per consumer (grouped by a label you
  # already extract, priced by the models below). See the Usage dashboard
  # page and GET /api/usage.
  billing:
    consumer_label: tenant
    currency: USD
    prices:
      per_request: 0.0001
      per_gb: 0.05
      per_meter_unit:
        tokens: 0.000002        # e.g. $2 per 1M LLM tokens

defaults:
  capture:
    request_body: true
    response_body: true
    headers: true
  # Max bytes of each body persisted into telemetry (bodies are still proxied
  # in full — this only bounds what OpticTrace records).
  capture_limit_bytes: 65536

rules:
  # ---------------------------------------------------------------------------
  # RESTRICTION: never capture bodies or headers on authentication routes.
  # ---------------------------------------------------------------------------
  - name: no-capture-on-auth
    match:
      path: "/api/v1/auth/**"
    restrict: [request_body, response_body, headers]
    # Capture and attribution are independent: a label is read from the LIVE
    # request, so this route can be billed to a tenant while none of its
    # payload is recorded. Without this, every login is revenue you cannot
    # attribute to a customer.
    labels:
      tenant: "header:X-Tenant-ID"

  # ---------------------------------------------------------------------------
  # REDACTION: payments flow — scrub credentials from headers and mask
  # sensitive JSON fields in captured payloads. Traffic itself is untouched;
  # redaction applies to what OpticTrace records.
  # ---------------------------------------------------------------------------

  - name: redact-payment-secrets
    match:
      path: "/api/v1/payments/**"
      methods: [POST, PUT, PATCH]
    redact:
      headers:
        - Authorization
        - X-Api-Key
        - Cookie
      # A credential in a query string is still a credential, and it lands in
      # the recorded URL rather than in a header — a separate place, needing a
      # separate rule. Everything not named here survives, so `?page=2` is
      # still there to debug with.
      query_params: [api_key, session, token]
      json_fields:
        # `**` = recursive descent: match the field at ANY nesting depth,
        # so an upstream echoing the payload back can't leak it either.
        - "$.**.credit_card.number"
        - "$.**.credit_card.cvv"
        - "$.**.customer.email"
        - "$.*.ssn"            # `*` = any single key: ssn under any top-level object
    labels:
      # Label sources: header, query, path:<n>, static, json, json_response —
      # each optionally followed by |<regex> to capture part of the value.
      tenant:  "header:X-Tenant-ID"           # a Prometheus dimension + log field
      region:  "header:X-Region|^([a-z]{2})-" # eu-west-1 -> eu
      # From the PAYLOAD. This is the case headers cannot reach: several
      # partners calling one endpoint with the same tenant and the same
      # product, separated only by a field of the body.
      partner: "json:$.**.source"
      # And from the response, once it is known.
      outcome: "json_response:$.status"
    # Sampling. `sample` is a uniform draw made up front; the keep_* rules are
    # TAIL-BASED — they rescue the requests you actually want after the outcome
    # is known, instead of letting a coin flip discard your errors.
    # sample: 0.25              # capture bodies for 25% of matched requests
    # keep_errors: true         # ...but always keep 5xx
    # keep_slower_than: 500ms   # ...and anything this slow

  # ---------------------------------------------------------------------------
  # TAGGING BY CRITERIA. Rules merge top to bottom and later ones win, so a
  # broad default plus a narrow override is all conditional tagging needs —
  # there is deliberately no separate `tags:` block to learn.
  #
  # match.headers / match.query / match.body take regular expressions.
  # Unanchored like Go's regexp, so write ^ and $ for a whole-value match;
  # "." means "present and non-empty".
  # ---------------------------------------------------------------------------
  - name: tag-channel-default
    match:
      path: "/api/v1/payments/**"
    labels:
      channel: "static:direct"

  - name: tag-marketplace-callers
    match:
      path: "/api/v1/payments/**"
      body:
        "$.**.source": "^(flipkart|amazon)$"
    labels:
      channel: "static:marketplace"

  - name: tag-premium-plans
    match:
      path: "/api/v1/payments/**"
      headers:
        X-Plan: "^(gold|platinum)$"
    labels:
      tier: "static:premium"

  # ---------------------------------------------------------------------------
  # METERING: extract numeric usage from responses (here: LLM token counts)
  # for per-tenant cost attribution. Metering works even when body capture
  # is restricted — the payload is read for the number, never stored.
  # ---------------------------------------------------------------------------
  - name: meter-ai-tokens
    match:
      path: "/api/v1/ai/**"
    restrict: [request_body, response_body]   # prompts/completions stay private
    meter:
      tokens: "$.usage.total_tokens"
    labels:
      tenant: "header:X-Tenant-ID"

  # ---------------------------------------------------------------------------
  # RESTRICTION + REDACTION can combine: webhooks keep headers but no bodies.
  # ---------------------------------------------------------------------------
  - name: webhooks-metadata-only
    match:
      path: "/webhooks/*"
    restrict: [request_body, response_body]
    redact:
      headers: [X-Webhook-Signature]

  # Hot read path. Two things happen here, and they are independent:
  #
  #  - The customer's email is masked. It arrives in the RESPONSE, not the
  #    request, which is the leak that gets missed — nobody sent it, so nobody
  #    thinks of it as data they are storing.
  #  - Bodies are sampled at 20%, but `keep_errors` and `keep_slower_than` are
  #    tail-based: they rescue a record AFTER the outcome is known. A coin flip
  #    that discards your 500s is worse than no sampling at all.
  - name: sample-user-reads
    match:
      path: "/api/v1/users/**"
      methods: [GET]
    redact:
      json_fields:
        - "$.**.email"
    sample: 0.2
    keep_errors: true
    keep_slower_than: 250ms
    labels:
      tenant: "header:X-Tenant-ID"
