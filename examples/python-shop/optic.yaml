# =============================================================================
# Governance for the Python shop — three FastAPI services, one policy.
# =============================================================================
# Every service loads THIS file and governs itself in-process via the SDK, then
# ships the already-governed record to the agent. Sensitive values never cross
# a process boundary in the clear: redaction happens inside the service that
# saw the data, not in a collector downstream.
#
# The agent here runs in COLLECTOR mode — no service.listen, no upstream,
# because nothing is being proxied. It exists to store, aggregate and expose.
version: 1

service:
  name: shop            # overridden per service at startup
  trace:
    response_header: X-Trace-Id

telemetry:
  admin_listen: "127.0.0.1:9095"
  console_log: false
  metrics:
    enabled: true
    max_label_values: 500
  store:
    driver: sqlite
    dsn: shop.db
    retention_max_rows: 200000
  app_logs:
    enabled: true
    level_min: debug        # this demo wants to SHOW the debug line being masked
    max_lines_per_span: 200
    max_message_bytes: 8192
    retention_max_age: 168h
    drop_orphans: true
    redact:
      # Single-quoted: YAML double quotes reject escapes like \s.
      patterns:
        - 'Bearer\s+\S+'
        - '\b\d{13,19}\b'                 # card-shaped digit runs
        - '[\w.+-]+@[\w-]+\.[\w.]+'       # email addresses
      fields: [authorization, password, card_number, email]
  billing:
    consumer_label: tenant
    currency: USD
    prices:
      per_request: 0.0002
      per_gb: 0.05
      per_meter_unit:
        order_value: 0.001      # 0.1% of order value, priced as a meter

defaults:
  capture:
    request_body: true
    response_body: true
    headers: true

rules:
  # Checkout carries the card and the customer. Mask both; keep everything
  # else, because an order you cannot inspect is an order you cannot support.
  - name: redact-checkout-secrets
    match:
      path: "/api/v1/orders"
      methods: [POST]
    redact:
      headers: [Authorization, Cookie]
      json_fields:
        - "$.**.card.number"
        - "$.**.card.cvv"
        - "$.**.customer.email"
    meter:
      order_value: "$.total"
    labels:
      tenant:  "header:X-Tenant-ID"
      region:  "header:X-Region|^([a-z]{2})-"   # ap-south-1 -> ap
      channel: "query:channel"
      plan:    "header:X-Plan"

  # The payment leg, called service-to-service. Same secrets, different hop.
  - name: redact-payment-leg
    match:
      path: "/api/v1/payments/**"
    redact:
      headers: [Authorization]
      json_fields:
        - "$.**.card.number"
        - "$.**.card.cvv"
    labels:
      tenant: "header:X-Tenant-ID"
      region: "header:X-Region|^([a-z]{2})-"

  # Credentials must never reach telemetry — metadata only. The tenant label
  # still resolves, because attribution and capture are independent.
  - name: no-capture-on-login
    match:
      path: "/api/v1/login"
    restrict: [request_body, response_body, headers]
    labels:
      tenant: "header:X-Tenant-ID"

  # Catalog reads are the hot path: sample them, but never lose an error.
  - name: sample-catalog-reads
    match:
      path: "/api/v1/catalog/**"
      methods: [GET]
    sample: 0.4
    keep_errors: true
    keep_slower_than: 200ms
    labels:
      tenant: "header:X-Tenant-ID"

  # NOTE: /api/v1/health is deliberately ungoverned, so `optictrace scan` and
  # `suggest` have something real to find in this example.
